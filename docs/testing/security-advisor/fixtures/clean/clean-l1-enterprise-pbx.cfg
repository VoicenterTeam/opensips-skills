####### clean-l1-enterprise-pbx.cfg
# Reference L1 enterprise PBX cfg — paired with golden_clean_l1.md.
# Target: OpenSIPS 3.5.4. Profile: L1.
# Expected advisor output: 0 findings, 3 informational observations.

log_level=2
children=8
disable_tcp=no
auto_aliases=no
alias=pbx.example.com

listen=udp:10.0.1.10:5060
listen=tcp:10.0.1.10:5060
listen=tls:10.0.1.10:5061

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

####### Modules
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "textops.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "uac.so"
loadmodule "uac_auth.so"
loadmodule "proto_udp.so"
loadmodule "proto_tcp.so"
loadmodule "proto_tls.so"
loadmodule "tls_mgm.so"
loadmodule "mi_fifo.so"
loadmodule "mi_http.so"
modparam("mi_http", "ip", "127.0.0.1")
modparam("mi_http", "port", 8080)
loadmodule "pike.so"
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 20)
modparam("pike", "remove_latency", 4)
loadmodule "ratelimit.so"
loadmodule "acc.so"
modparam("acc", "log_level", 1)
modparam("acc", "log_facility", "LOG_LOCAL1")
loadmodule "dialog.so"
modparam("dialog", "default_timeout", 21600)
loadmodule "permissions.so"
loadmodule "rtpengine.so"
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:22222")
loadmodule "db_mysql.so"

####### auth_db / usrloc / registrar — HA1B mode (no plaintext password column)
modparam("auth_db", "db_url", "mysql://opensips@db.internal/opensips")
modparam("auth_db", "calculate_ha1", 0)
modparam("auth_db", "password_column", "ha1")
modparam("auth_db", "password_column_2", "ha1b")
modparam("usrloc", "db_url", "mysql://opensips@db.internal/opensips")
modparam("usrloc", "db_mode", 2)
modparam("registrar", "max_contacts", 5)

####### TLS — verification mandatory; cipher list at L1 baseline
modparam("tls_mgm", "tls_method",      "[default]TLSv1.2+")
modparam("tls_mgm", "verify_cert",     "[default]1")
modparam("tls_mgm", "require_cert",    "[default]1")
modparam("tls_mgm", "ca_list",         "[default]/etc/opensips/tls/ca.pem")
modparam("tls_mgm", "certificate",     "[default]/etc/opensips/tls/cert.pem")
modparam("tls_mgm", "private_key",     "[default]/etc/opensips/tls/key.pem")
modparam("tls_mgm", "tls_ciphers_list","[default]HIGH:!aNULL:!MD5")

####### Routing — auth before routing, is_myself before t_relay, $fU escaped
request_route {
    if (!mf_process_maxfwd_header("10")) {
        send_reply(483, "Too Many Hops");
        exit;
    }
    if (!pike_check_req()) {
        xlog("L_ALERT", "pike block from $si\n");
        exit;
    }

    if (!is_myself("$rd") && !has_totag()) {
        send_reply(403, "Forbidden");
        exit;
    }

    if (has_totag()) {
        if (loose_route()) { t_relay(); } else { send_reply(404, "Not here"); }
        exit;
    }

    if (is_method("REGISTER")) {
        route(handle_register);
        exit;
    }

    if (is_method("INVITE|MESSAGE|SUBSCRIBE")) {
        if (!proxy_authorize("$td", "subscriber")) {
            proxy_challenge("$td", "0");
            exit;
        }
        if ($au != $fU) { send_reply(403, "Caller mismatch"); exit; }
        consume_credentials();
    }

    record_route();

    # SIP-sourced taint is escaped before SQL
    $avp(safe_fU) = $(fU{s.escape.common});
    avp_db_query("SELECT route FROM dialplan WHERE prefix='$avp(safe_fU)'",
                 "$avp(route)");

    if (!t_relay()) { sl_send_reply(500, "Relay error"); }
}

route[handle_register] {
    if (!www_authenticate("$td", "subscriber")) {
        www_challenge("$td", 0);
        exit;
    }
    if ($au != $tU) { send_reply(403, "Forbidden"); exit; }
    if (!save("location")) { sl_reply_error(); }
}

failure_route {
    if (t_was_cancelled()) { exit; }
    if (t_check_status("486|408")) {
        xlog("L_NOTICE", "call failed for $fU: $T_reply_code\n");
    }
}

onreply_route {
    if (status =~ "1[0-9][0-9]") { exit; }
}
