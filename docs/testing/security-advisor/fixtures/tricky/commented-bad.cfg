####### commented-bad.cfg
# Tricky fixture: dangerous directives are PRESENT IN COMMENTS but
# inactive in the live cfg. Tests that the parser respects comment
# boundaries — rules must NOT fire on commented-out directives.
#
# Target: OpenSIPS 3.5.4. Profile: L1.
# Expected behavior: clean cfg from the engine's perspective (1
# informational from the operator preface).

log_level=2
children=4
listen=udp:127.0.0.1:5060
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

# OPERATOR NOTE — Pre-deployment hardening checklist:
# The following lines were CONSIDERED and REJECTED.
# They are kept here for audit trail purposes, commented out:
#
# modparam("mi_http", "ip", "0.0.0.0")            # rejected: too permissive
# modparam("tls_mgm", "verify_cert", "[default]0")  # rejected: cert verify disabled
# modparam("auth_db", "calculate_ha1", 1)          # rejected: plaintext password column
#
# Engine MUST NOT flag any of the above as findings. They are textual
# only and not part of the parsed cfg.

loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "mi_http.so"
modparam("mi_http", "ip", "127.0.0.1")
modparam("mi_http", "port", 8080)
loadmodule "tls_mgm.so"
loadmodule "proto_udp.so"
loadmodule "proto_tls.so"
loadmodule "pike.so"
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 20)
loadmodule "db_mysql.so"

# Same comment-discipline test for inline trailing comments:
modparam("auth_db", "db_url", "mysql://opensips@db.internal/opensips")
modparam("auth_db", "calculate_ha1", 0)              # safe: HA1 column mode
modparam("auth_db", "password_column", "ha1")
# modparam("auth_db", "calculate_ha1", 1)            # commented-out test case
modparam("usrloc", "db_url", "mysql://opensips@db.internal/opensips")

modparam("tls_mgm", "verify_cert", "[default]1")      # active and correct
modparam("tls_mgm", "require_cert", "[default]1")
modparam("tls_mgm", "ca_list", "[default]/etc/opensips/tls/ca.pem")
modparam("tls_mgm", "certificate", "[default]/etc/opensips/tls/cert.pem")
modparam("tls_mgm", "private_key", "[default]/etc/opensips/tls/key.pem")

alias=proxy.example.com

####### Routing — clean L1 shape
request_route {
    if (!mf_process_maxfwd_header("10")) {
        send_reply(483, "Too Many Hops");
        exit;
    }
    if (!pike_check_req()) { exit; }

    if (!is_myself("$rd") && !has_totag()) {
        send_reply(403, "Forbidden");
        exit;
    }

    if (has_totag()) {
        if (loose_route()) { t_relay(); } else { send_reply(404, "Not here"); }
        exit;
    }

    if (is_method("REGISTER")) {
        if (!www_authenticate("$td", "subscriber")) {
            www_challenge("$td", 0);
            exit;
        }
        save("location");
        exit;
    }

    if (is_method("INVITE|MESSAGE|SUBSCRIBE")) {
        if (!proxy_authorize("$td", "subscriber")) {
            proxy_challenge("$td", "0");
            exit;
        }
        consume_credentials();
    }

    record_route();
    t_relay();
}
