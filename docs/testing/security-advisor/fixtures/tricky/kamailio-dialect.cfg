####### kamailio-dialect.cfg
# Tricky fixture: cfg uses Kamailio idioms that are NOT valid OpenSIPS.
# Tests engine behavior on a cfg an LLM authoring tool might produce
# from training data conflating OpenSIPS with Kamailio/OpenSER.
#
# Expected behavior: parser flags Kamailio-only directives as
# unrecognized; engine emits OSIPS-SEC-CFG-PARSE-ERROR or skips
# unrecognized regions per 14_DETECTION_ENGINE.md § "Failure modes".
# Rules targeting recognized portions still fire normally.
#
# Target: claimed OpenSIPS 3.5.4 in declared version (matches reality
# of an LLM-generated cfg); actual content is a Kamailio/OpenSIPS hybrid.

log_level=2
children=4
listen=udp:0.0.0.0:5060
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

####### These are valid OpenSIPS modules
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "auth.so"
loadmodule "auth_db.so"

####### Kamailio-only modules — these do NOT exist in OpenSIPS
loadmodule "sanity.so"           # Kamailio's sanity-check module; OpenSIPS uses sipmsgops
loadmodule "secfilter.so"        # Kamailio's security-filter module; no OpenSIPS equivalent
loadmodule "kex.so"              # Kamailio core extensions; not present on OpenSIPS

####### auth_db
modparam("auth_db", "db_url", "mysql://opensips:opensipspw@db.internal/opensips")
modparam("auth_db", "calculate_ha1", 1)

####### Kamailio idiom: KSR.* function calls in route blocks
# OpenSIPS does not have a KSR namespace; these are Kamailio's KEMI dispatcher.
request_route {
    # Kamailio-only: sanity_check() with bitmask argument
    if (!sanity_check("17895")) {
        xlog("L_WARN", "Malformed SIP message\n");
        exit;
    }

    # Kamailio-only: secfilter rule check
    if (secf_check_from()) {
        xlog("L_NOTICE", "blacklisted From\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }

    # Kamailio idiom: $var(x) for script variables — different scope semantics on OpenSIPS
    $var(prefix) = $(rU{s.substr,0,4});

    # Mixed valid OpenSIPS + Kamailio dialect:
    if (is_method("REGISTER")) {
        # Kamailio idiom: allow_address(group, ip, port) signature
        if (!allow_address("0", "$si", "$sp")) {
            sl_send_reply("403", "Forbidden");
            exit;
        }

        if (!www_authenticate("$td", "subscriber")) {
            www_challenge("$td", 0);
            exit;
        }
        save("location");
        exit;
    }

    # Kamailio-only: KSR.tm.t_relay() KEMI-style invocation
    # NOTE: this would be a parse error on OpenSIPS
    # KSR.tm.t_relay();

    # OpenSIPS-valid t_relay call without is_myself guard — RELAY-001 should still
    # fire on this even though surrounding cfg is dialect-confused
    avp_db_query("SELECT route FROM dialplan WHERE prefix='$fU'", "$avp(route)");
    t_relay();
}

failure_route {
    if (t_was_cancelled()) { exit; }
}
