####### custom-sanitizer.cfg
# OpenSIPS cfg using a custom Perl module for input sanitization and authz.
# Demonstrates the advisor's review_required abstention for opaque transforms.
# Target: OpenSIPS 3.5.4. Paired with golden_tricky_abstention.md.

log_level=2
children=4
listen=udp:0.0.0.0:5060
listen=tls:0.0.0.0:5061
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "perl.so"
modparam("perl", "filename", "/etc/opensips/sanitize.pl")
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "tls_mgm.so"
modparam("tls_mgm", "verify_cert", "[default]0")
modparam("tls_mgm", "require_cert", "[default]0")
modparam("tls_mgm", "certificate", "[default]/etc/opensips/tls/cert.pem")
modparam("tls_mgm", "private_key", "[default]/etc/opensips/tls/key.pem")
loadmodule "proto_tls.so"
loadmodule "proto_udp.so"
loadmodule "acc.so"
loadmodule "dialog.so"
loadmodule "db_mysql.so"
loadmodule "permissions.so"

####### auth_db
modparam("auth_db", "db_url", "mysql://opensips@db.internal/opensips")
modparam("auth_db", "calculate_ha1", 0)
modparam("auth_db", "password_column", "ha1")
modparam("usrloc", "db_url", "mysql://opensips@db.internal/opensips")
modparam("usrloc", "db_mode", 2)

# No pike, no ratelimit -- F4 will fire.

alias=proxy.example.com

####### Operational note for reviewers
# /etc/opensips/sanitize.pl provides:
#   My::Sanitize::clean_username($fU, $avp_out)
#   My::Auth::check_caller($fU, $avp_out)
# The advisor cannot statically verify Perl source; both calls
# will produce kind: review_required findings rather than
# confirmed vulnerabilities or silent passes.

####### MI on loopback (informational only)
loadmodule "mi_fifo.so"
modparam("mi_fifo", "fifo_name", "/tmp/opensips_fifo")

####### Dialog timeout
modparam("dialog", "default_timeout", 14400)

####### Tracing config (commented out)
# loadmodule "siptrace.so"
# modparam("siptrace", "trace_mode", 1)

####### Internal lookup route — uses Perl sanitizer
# See operational note re: My::Sanitize::clean_username
route[lookup_user] {
    perl_exec_simple("My::Sanitize::clean_username", "$fU", "$avp(safe_user)");
    avp_db_query("SELECT id, role FROM users WHERE username='$avp(safe_user)'",
                 "$avp(uid)");
}

####### Register handler (kept simple for fixture)
route[handle_register] {
    if (!www_authenticate("$td", "subscriber")) { www_challenge("$td", 0); exit; }
    save("location");
}

####### request_route — INVITE auth delegated to Perl
request_route {
    if (is_method("INVITE")) {
        perl_exec_simple("My::Auth::check_caller", "$fU", "$avp(authz_ok)");
        if ($avp(authz_ok) != "1") {
            send_reply(403, "Forbidden");
            exit;
        }
        route(lookup_user);
        t_relay();
    }
    # Other methods not handled in this fixture.
}

failure_route {
    if (t_was_cancelled()) { exit; }
}

onreply_route {
    if (status =~ "1[0-9][0-9]") { exit; }
}
