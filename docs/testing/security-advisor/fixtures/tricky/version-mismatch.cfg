####### version-mismatch.cfg
# Tricky fixture: cfg declares one OpenSIPS version (via comment header
# or external metadata) but the syntax signatures in the cfg point to
# a different version. Tests that the engine's version-detection logic
# corroborates declared version against cfg evidence and surfaces a
# warning when they disagree.
#
# Declared: OpenSIPS 3.4.x (per comment).
# Signatures suggest: 3.6+ (uses tls_wolfssl, which exists only in 3.6+).
#
# Engine should EITHER:
#   (a) detect the mismatch and emit a synthetic finding/diagnostic
#       indicating "declared version 3.4 inconsistent with cfg
#       signatures suggesting >=3.6"
#   (b) refuse to run rules version-gated to 3.4 because corroborating
#       signals contradict the declaration
#   (c) downgrade detected_version_confidence to "low" in the
#       AnalysisContext and surface this in Appendix D
#
# Any of (a)/(b)/(c) is acceptable; silently trusting the declaration
# is NOT acceptable.

####### Header declares 3.4.x deployment
# Operator note: OpenSIPS 3.4.10 production deployment.
# Last upgrade: 2024 — running on Ubuntu 22.04.

log_level=2
children=4
listen=udp:0.0.0.0:5060
listen=tls:0.0.0.0:5061

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"

####### THIS IS THE GIVEAWAY: tls_wolfssl exists ONLY in 3.6+.
####### A 3.4 cfg cannot load this module — it doesn't exist in 3.4.
loadmodule "tls_wolfssl.so"
modparam("tls_wolfssl", "verify_cert", "[default]1")
modparam("tls_wolfssl", "require_cert", "[default]1")
modparam("tls_wolfssl", "certificate", "[default]/etc/opensips/tls/cert.pem")
modparam("tls_wolfssl", "private_key", "[default]/etc/opensips/tls/key.pem")

loadmodule "proto_udp.so"
loadmodule "proto_tls.so"
loadmodule "pike.so"
loadmodule "db_mysql.so"

modparam("auth_db", "db_url", "mysql://opensips@db.internal/opensips")
modparam("auth_db", "calculate_ha1", 0)
modparam("auth_db", "password_column", "ha1")
modparam("usrloc", "db_url", "mysql://opensips@db.internal/opensips")
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 20)

alias=proxy.example.com

request_route {
    if (!mf_process_maxfwd_header("10")) {
        send_reply(483, "Too Many Hops");
        exit;
    }
    if (!pike_check_req()) { exit; }

    if (!is_myself("$rd") && !has_totag()) {
        send_reply(403, "Forbidden");
        exit;
    }

    if (has_totag()) {
        if (loose_route()) { t_relay(); } else { send_reply(404, "Not here"); }
        exit;
    }

    if (is_method("REGISTER")) {
        if (!www_authenticate("$td", "subscriber")) {
            www_challenge("$td", 0);
            exit;
        }
        save("location");
        exit;
    }

    if (is_method("INVITE|MESSAGE")) {
        if (!proxy_authorize("$td", "subscriber")) {
            proxy_challenge("$td", "0");
            exit;
        }
        consume_credentials();
    }

    record_route();
    t_relay();
}
