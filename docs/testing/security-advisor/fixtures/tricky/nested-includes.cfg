####### nested-includes.cfg
# Tricky fixture: cfg uses include_file directives that pull in
# external content. v1.0 engine analyzes the parent cfg as-is and does
# NOT resolve includes. Tests that:
#  (a) the engine surfaces the unresolved include as a diagnostic note;
#  (b) rules targeting the parent cfg's content still fire normally;
#  (c) rules whose triggers might be satisfied by the included content
#      do NOT silently pass — the engine must flag the include as a
#      blind spot.
#
# Target: OpenSIPS 3.5.4. Profile: L1.

log_level=2
children=4
listen=udp:0.0.0.0:5060
listen=tls:0.0.0.0:5061
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "tls_mgm.so"
loadmodule "proto_udp.so"
loadmodule "proto_tls.so"
loadmodule "pike.so"
loadmodule "db_mysql.so"

####### Secret block extracted to a separate file (good operator practice)
include_file "/etc/opensips/secrets.cfg"

####### TLS config extracted (also good operator practice)
include_file "/etc/opensips/tls.cfg"

####### Module-tuning extracted
include_file "/etc/opensips/tuning.cfg"

modparam("auth_db", "calculate_ha1", 0)
modparam("auth_db", "password_column", "ha1")

modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 20)

alias=proxy.example.com

####### Routing — clean L1 shape
request_route {
    if (!mf_process_maxfwd_header("10")) {
        send_reply(483, "Too Many Hops");
        exit;
    }
    if (!pike_check_req()) { exit; }

    if (!is_myself("$rd") && !has_totag()) {
        send_reply(403, "Forbidden");
        exit;
    }

    if (has_totag()) {
        if (loose_route()) { t_relay(); } else { send_reply(404, "Not here"); }
        exit;
    }

    if (is_method("REGISTER")) {
        if (!www_authenticate("$td", "subscriber")) {
            www_challenge("$td", 0);
            exit;
        }
        save("location");
        exit;
    }

    if (is_method("INVITE|MESSAGE|SUBSCRIBE")) {
        if (!proxy_authorize("$td", "subscriber")) {
            proxy_challenge("$td", "0");
            exit;
        }
        consume_credentials();
    }

    record_route();
    t_relay();
}
