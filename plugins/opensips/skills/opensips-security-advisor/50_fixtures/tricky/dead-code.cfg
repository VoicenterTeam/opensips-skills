####### dead-code.cfg
# Tricky fixture: bad directives appear in syntactically-valid but
# UNREACHABLE code paths. Tests that the engine is intentionally NOT
# path-sensitive in v1.0 — per 14_DETECTION_ENGINE.md § "Open issues",
# unreachable code is treated as reachable.
#
# This fixture's contract is the OPPOSITE of commented-bad.cfg:
# rules SHOULD fire on the dead routes, because v1.0 is not
# path-sensitive. Authors who think dead code is silently safe are
# wrong on v1.0; making this explicit prevents the bad assumption.
#
# Target: OpenSIPS 3.5.4. Profile: L1.

log_level=2
children=4
listen=udp:0.0.0.0:5060
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "tls_mgm.so"
loadmodule "proto_udp.so"
loadmodule "proto_tls.so"
loadmodule "pike.so"
loadmodule "db_mysql.so"

modparam("auth_db", "db_url", "mysql://opensips@db.internal/opensips")
modparam("auth_db", "calculate_ha1", 0)
modparam("auth_db", "password_column", "ha1")
modparam("usrloc", "db_url", "mysql://opensips@db.internal/opensips")

####### TLS active-domain config (live, clean)
modparam("tls_mgm", "verify_cert", "[default]1")
modparam("tls_mgm", "require_cert", "[default]1")
modparam("tls_mgm", "ca_list", "[default]/etc/opensips/tls/ca.pem")
modparam("tls_mgm", "certificate", "[default]/etc/opensips/tls/cert.pem")
modparam("tls_mgm", "private_key", "[default]/etc/opensips/tls/key.pem")

####### TLS legacy-domain config (defined but never reachable in routing)
# This domain is named "legacy" but no listener references it and
# no route invokes it. Configuration is still parsed and its
# modparams will trigger TLS-001 even though it's effectively dead.
modparam("tls_mgm", "verify_cert", "[legacy]0")
modparam("tls_mgm", "require_cert", "[legacy]0")
modparam("tls_mgm", "certificate", "[legacy]/etc/opensips/tls/legacy_cert.pem")
modparam("tls_mgm", "private_key", "[legacy]/etc/opensips/tls/legacy_key.pem")

alias=proxy.example.com

####### Routing — main path is clean
request_route {
    if (!mf_process_maxfwd_header("10")) {
        send_reply(483, "Too Many Hops");
        exit;
    }
    if (!pike_check_req()) { exit; }

    if (!is_myself("$rd") && !has_totag()) {
        send_reply(403, "Forbidden");
        exit;
    }

    if (has_totag()) {
        if (loose_route()) { t_relay(); } else { send_reply(404, "Not here"); }
        exit;
    }

    if (is_method("INVITE|MESSAGE|SUBSCRIBE")) {
        if (!proxy_authorize("$td", "subscriber")) {
            proxy_challenge("$td", "0");
            exit;
        }
        consume_credentials();
    }

    record_route();
    t_relay();
}

####### Dead route — defined but never invoked from request_route or any
####### other reachable point. Contains an open-relay shape that v1.0
####### engine WILL flag (because v1.0 is not path-sensitive).
route[unused_legacy_relay] {
    # No is_myself, no allow_routing, no auth — straight to t_relay.
    avp_db_query("SELECT route FROM legacy_dialplan WHERE prefix='$fU'", "$avp(route)");
    t_relay();
}

####### Another dead route — never invoked.
route[debug_dump] {
    xlog("L_NOTICE", "DEBUG: From=$fU header=$hdr(Authorization)\n");
    return;
}

failure_route {
    if (t_was_cancelled()) { exit; }
}
