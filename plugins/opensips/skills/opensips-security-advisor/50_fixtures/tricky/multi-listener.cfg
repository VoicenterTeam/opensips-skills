####### multi-listener.cfg
# Tricky fixture: cfg has multiple listen= directives across different
# interfaces and protocols. Tests engine awareness of per-listener
# context — public-facing listeners deserve different scrutiny than
# loopback listeners.
#
# Target: OpenSIPS 3.5.4. Profile: L1.
#
# Listener inventory:
#   udp:0.0.0.0:5060      — public, unauthenticated SIP
#   tls:0.0.0.0:5061      — public, TLS
#   udp:127.0.0.1:5062    — loopback, internal-only
#   tcp:10.0.0.10:5063    — internal/management network
#
# Engine should recognize that the public listeners (5060, 5061) raise
# the bar on TLS posture and DoS protection, while the loopback (5062)
# and internal (5063) listeners do not.

log_level=2
children=8
listen=udp:0.0.0.0:5060
listen=tls:0.0.0.0:5061
listen=udp:127.0.0.1:5062
listen=tcp:10.0.0.10:5063

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "tls_mgm.so"
loadmodule "proto_udp.so"
loadmodule "proto_tcp.so"
loadmodule "proto_tls.so"
loadmodule "pike.so"
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 20)
loadmodule "db_mysql.so"

modparam("auth_db", "db_url", "mysql://opensips@db.internal/opensips")
modparam("auth_db", "calculate_ha1", 0)
modparam("auth_db", "password_column", "ha1")
modparam("usrloc", "db_url", "mysql://opensips@db.internal/opensips")

####### TLS — verification mandatory on the default domain (used by 5061)
modparam("tls_mgm", "tls_method",      "[default]TLSv1.2+")
modparam("tls_mgm", "verify_cert",     "[default]1")
modparam("tls_mgm", "require_cert",    "[default]1")
modparam("tls_mgm", "ca_list",         "[default]/etc/opensips/tls/ca.pem")
modparam("tls_mgm", "certificate",     "[default]/etc/opensips/tls/cert.pem")
modparam("tls_mgm", "private_key",     "[default]/etc/opensips/tls/key.pem")

alias=proxy.example.com

####### Routing — same logic regardless of which listener received the request
request_route {
    if (!mf_process_maxfwd_header("10")) {
        send_reply(483, "Too Many Hops");
        exit;
    }

    # Pike protection — applied uniformly. (Could be conditional on
    # $proto / $Ri to skip on internal listeners; this cfg does not.)
    if (!pike_check_req()) { exit; }

    if (!is_myself("$rd") && !has_totag()) {
        send_reply(403, "Forbidden");
        exit;
    }

    if (has_totag()) {
        if (loose_route()) { t_relay(); } else { send_reply(404, "Not here"); }
        exit;
    }

    if (is_method("REGISTER")) {
        if (!www_authenticate("$td", "subscriber")) {
            www_challenge("$td", 0);
            exit;
        }
        save("location");
        exit;
    }

    if (is_method("INVITE|MESSAGE|SUBSCRIBE")) {
        if (!proxy_authorize("$td", "subscriber")) {
            proxy_challenge("$td", "0");
            exit;
        }
        consume_credentials();
    }

    record_route();
    t_relay();
}
