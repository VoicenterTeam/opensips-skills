####### false-positive-cvss-gate.cfg
# Tricky fixture: cfg loads auth_jwt with db_mode=1 (the structural
# pattern that triggers CVE-2026-25554 detection), BUT the OpenSIPS
# version is 3.6.5 — past the patched version 3.6.4. Tests that the
# engine's version-gating logic correctly EXCLUDES CVE-detection
# rules when the deployed version is past the fix.
#
# Without proper version gating, a structural-pattern matcher fires
# on every db_mode=1 cfg regardless of version, producing false
# positives for operators who have already patched.
#
# Target: OpenSIPS 3.6.5 (PATCHED — past 3.6.4 fix). Profile: L1.
# Expected: AUTH-004 (CVE-2026-25554 detector) does NOT fire.

log_level=2
children=4
listen=udp:0.0.0.0:5060
listen=tls:0.0.0.0:5061
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

# Operator note: OpenSIPS 3.6.5 — patched against CVE-2026-25554.

loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "auth_jwt.so"
modparam("auth_jwt", "db_url", "mysql://opensips@db.internal/opensips")
modparam("auth_jwt", "db_mode", 1)            # the CVE-vulnerable pattern, but version is patched
modparam("auth_jwt", "key_set_table", "jwt_keys")

loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "tls_mgm.so"
loadmodule "proto_udp.so"
loadmodule "proto_tls.so"
loadmodule "pike.so"
loadmodule "db_mysql.so"

modparam("auth_db", "db_url", "mysql://opensips@db.internal/opensips")
modparam("auth_db", "calculate_ha1", 0)
modparam("auth_db", "password_column", "ha1")
modparam("usrloc", "db_url", "mysql://opensips@db.internal/opensips")
modparam("tls_mgm", "verify_cert", "[default]1")
modparam("tls_mgm", "require_cert", "[default]1")
modparam("tls_mgm", "ca_list", "[default]/etc/opensips/tls/ca.pem")
modparam("tls_mgm", "certificate", "[default]/etc/opensips/tls/cert.pem")
modparam("tls_mgm", "private_key", "[default]/etc/opensips/tls/key.pem")
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 20)

alias=proxy.example.com

request_route {
    if (!mf_process_maxfwd_header("10")) {
        send_reply(483, "Too Many Hops");
        exit;
    }
    if (!pike_check_req()) { exit; }

    if (!is_myself("$rd") && !has_totag()) {
        send_reply(403, "Forbidden");
        exit;
    }

    if (has_totag()) {
        if (loose_route()) { t_relay(); } else { send_reply(404, "Not here"); }
        exit;
    }

    if (is_method("REGISTER")) {
        if (!www_authenticate("$td", "subscriber")) {
            www_challenge("$td", 0);
            exit;
        }
        save("location");
        exit;
    }

    if (is_method("INVITE|MESSAGE|SUBSCRIBE")) {
        if (!jwt_authorize()) {
            send_reply(403, "Forbidden");
            exit;
        }
    }

    record_route();
    t_relay();
}
