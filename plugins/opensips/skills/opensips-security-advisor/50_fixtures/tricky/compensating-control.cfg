####### compensating-control.cfg
# Tricky fixture: a structural shape that would normally fire a rule
# is present, but a compensating control elsewhere in the cfg mitigates
# the underlying risk. Tests engine awareness of compensating controls
# and proper confidence demotion when partial mitigation exists.
#
# Specific shape: mi_http binds to a non-loopback interface (would
# normally fire OSIPS-SEC-MI-001 critical), BUT mi_http_trusted_clients
# is set to a restrictive allowlist that limits exposure.
#
# Per OSIPS-SEC-MI-001 frontmatter and body: when a trusted-clients
# allowlist is present alongside a non-loopback bind, the engine
# should demote confidence rather than fire at full critical
# severity, because the compensating control narrows the attack
# surface to spoofing-of-allowlisted-source.
#
# Target: OpenSIPS 3.5.4. Profile: L1.

log_level=2
children=4
listen=udp:0.0.0.0:5060
listen=tls:0.0.0.0:5061
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"

loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "tls_mgm.so"
loadmodule "proto_udp.so"
loadmodule "proto_tls.so"
loadmodule "pike.so"
loadmodule "db_mysql.so"

####### MI HTTP — non-loopback bind WITH compensating control.
loadmodule "mi_http.so"
modparam("mi_http", "ip", "10.0.10.5")           # non-loopback: would fire MI-001
modparam("mi_http", "port", 8080)
modparam("mi_http", "mi_http_trusted_clients", "10.0.20.7,10.0.20.8")  # COMPENSATING CONTROL

modparam("auth_db", "db_url", "mysql://opensips@db.internal/opensips")
modparam("auth_db", "calculate_ha1", 0)
modparam("auth_db", "password_column", "ha1")
modparam("usrloc", "db_url", "mysql://opensips@db.internal/opensips")
modparam("tls_mgm", "verify_cert", "[default]1")
modparam("tls_mgm", "require_cert", "[default]1")
modparam("tls_mgm", "ca_list", "[default]/etc/opensips/tls/ca.pem")
modparam("tls_mgm", "certificate", "[default]/etc/opensips/tls/cert.pem")
modparam("tls_mgm", "private_key", "[default]/etc/opensips/tls/key.pem")
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 20)

alias=proxy.example.com

request_route {
    if (!mf_process_maxfwd_header("10")) {
        send_reply(483, "Too Many Hops");
        exit;
    }
    if (!pike_check_req()) { exit; }

    if (!is_myself("$rd") && !has_totag()) {
        send_reply(403, "Forbidden");
        exit;
    }

    if (has_totag()) {
        if (loose_route()) { t_relay(); } else { send_reply(404, "Not here"); }
        exit;
    }

    if (is_method("REGISTER")) {
        if (!www_authenticate("$td", "subscriber")) {
            www_challenge("$td", 0);
            exit;
        }
        save("location");
        exit;
    }

    if (is_method("INVITE|MESSAGE|SUBSCRIBE")) {
        if (!proxy_authorize("$td", "subscriber")) {
            proxy_challenge("$td", "0");
            exit;
        }
        consume_credentials();
    }

    record_route();
    t_relay();
}
