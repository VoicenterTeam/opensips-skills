####### vulnerable-mixed.cfg — sloppy mid-size operator config
# Reference vulnerable fixture: 10 findings, 5 severity levels.
# Target: OpenSIPS 3.6.2 (within CVE-2026-25554 vulnerable range).
# Paired with golden_vulnerable_mixed.md.

log_level=3
children=4
listen=udp:0.0.0.0:5060
listen=tls:0.0.0.0:5061

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"
loadmodule "auth_jwt.so"
modparam("auth_jwt", "db_url", "mysql://opensips:opensipspw@db.internal/opensips")
modparam("auth_jwt", "db_mode", 1)
loadmodule "permissions.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
modparam("auth_db", "db_url", "mysql://opensips:opensipspw@db.internal/opensips")
modparam("auth_db", "calculate_ha1", 1)
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "mi_http.so"
modparam("mi_http", "ip", "0.0.0.0")
modparam("mi_http", "port", 8080)
loadmodule "sipmsgops.so"
loadmodule "tls_mgm.so"
loadmodule "proto_tls.so"
loadmodule "proto_udp.so"
modparam("tls_mgm", "tls_method", "[default]TLSv1.2+")
modparam("tls_mgm", "verify_cert", "[default]0")
modparam("tls_mgm", "require_cert", "[default]0")
modparam("tls_mgm", "certificate", "[default]/etc/opensips/tls/cert.pem")
modparam("tls_mgm", "private_key", "[default]/etc/opensips/tls/key.pem")
loadmodule "acc.so"
modparam("acc", "log_level", 1)
modparam("acc", "log_facility", "LOG_LOCAL1")
loadmodule "dialog.so"
modparam("dialog", "default_timeout", 21600)
loadmodule "db_mysql.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
modparam("usrloc", "nat_bflag", "NAT")
modparam("usrloc", "db_mode", 2)
modparam("registrar", "max_contacts", 5)

# ITSP gateway — no flood protection
modparam("usrloc", "db_url", "mysql://opensips:opensipspw@db.internal/opensips")

# No pike. No ratelimit. No is_myself enforcement.

alias=mybox.example.com

# Listen sockets exposed directly to the Internet.
# No upstream proxy.

# Operator lab notes (TODO before prod):
# - usrloc shares DB password with auth_jwt and auth_db
# - tls disabled cert verify; intermediate CA was hard
# - mi_http on 0.0.0.0; ops dashboard polls from LAN
# - "we'll add pike later" — see ticket OPS-1471
# - REGISTER worked, INVITEs were blowing up so the team
#   moved the auth check after route() as a quick fix

# FIXME: nothing in this section has been reviewed by security


# ----- Routing logic -----


request_route {
    route(relay);                    # auth applied AFTER routing -- never reached for INVITE

    if (is_method("REGISTER")) {
        if (!www_authenticate("$td", "subscriber")) {
            www_challenge("$td", 0);
            exit;
        }
        save("location");
        exit;
    } else if (is_method("INVITE")) {
        avp_db_query("SELECT route FROM dialplan WHERE prefix='$fU'", "$avp(route)");
        xlog("L_NOTICE", "INVITE from $fU header: $hdr(Authorization)\n");
        t_relay();
    }

    # No fallback for OPTIONS, MESSAGE, etc.
}

failure_route {
    if (t_was_cancelled()) {
        exit;
    }
}

onreply_route {
    if (status =~ "1[0-9][0-9]") { exit; }
}

# The relay sub-route — called from request_route BEFORE any auth check
route[relay] {
    # forward() here is unconditional and unauthenticated
    forward();
}
